name: LightMeter
targets:
  LightMeter:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - LightMeter
    settings:
      base:
        INFOPLIST_FILE: LightMeter/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.LightMeter
        PRODUCT_NAME: LightMeter
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # iPhone 16 Pro 优化
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
    info:
      path: LightMeter/Info.plist
      properties:
        NSCameraUsageDescription: "LightMeter 需要访问您的相机来进行实时测光。相机画面仅用于曝光分析和测光点标记，不会被保存或上传到任何地方。"
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "SceneDelegate"
